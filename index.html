<!DOCTYPE html>
<html lang="en">


<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="shortcut icon" href="./assets/icons/burger_logo.svg" type="image/x-icon">


    <link rel="stylesheet" href="./styles/variable.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/basket.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="style.css">


</head>


<body>


    <section class="head_area">
        <nav>
            <img src="./assets/icons/logo.svg" alt="Bestell App Logo">
            <img class="button_menu" src="./assets/icons/menu_button.svg" alt="Menu Button">
        </nav>
    </section>


    <header>
        <img class="hero_img" src="./assets/img/hero.jpg" alt="Image with different kind of Food">
        <img class="burger_logo" src="./assets/icons/burger_logo.svg" alt="Burger image">


        <div class="title">
            <h1><span class="title_design">Burger</span>House</h1>
            <img src="./assets/icons/review.jpg" alt="Website Review">
        </div>

        
        <span>The best of Burgers, Pizza, and Greens, all in one great place.</span>
    </header>


    <section class="quick_navigation" id="navigationToDishCategory">
        <button class="quick_button" data-target="categoryBurger">Burgers</button>
        <button class="quick_button" data-target="categoryPizza">Pizza</button>
        <button class="quick_button" data-target="categorySalad">Salad</button>
    </section>


    <main>
        <section class="order_area">
            <article id="menu">
                <section class="title_menu">
                    <img src="./assets/icons/burger_icon.svg" alt="Image of Burger">
                    <h2>Burgers</h2>
                </section>
                <div id="menuSection"></div>

                <section class="title_menu">
                    <img src="./assets/icons/pizza_icon.svg" alt="Image of Pizza">
                    <h2>Pizza <span class="title_information">(30cm)</span></h2>
                </section>
                <div id="menuSection"></div>

                <section class="title_menu">
                    <img src="./assets/icons/salad_icon.svg" alt="Image of Salad">
                    <h2>Salad</h2>
                </section>
                <div id="menuSection"></div>
            </article>

            <aside>
                <section class="order_basket">
                    <h2>Your Basket</h2>
                    <p>
                        Nothing here yet.
                        Go ahead and choose something delicious
                    </p>
                    <img src="./assets/icons/shopping_cart.svg" alt="Image of Shopping Cart">
                </section>
            </aside>
        </section>
    </main>
    

    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="script.js"></script>

    
</body>
</html>
