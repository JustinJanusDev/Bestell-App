<!DOCTYPE html>
<html lang="en">


<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="shortcut icon" href="./assets/icons/burger_logo.svg" type="image/x-icon">


    <link rel="stylesheet" href="./styles/variable.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/basket.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="style.css">


</head>


<body>


    <section class="head_area">
        <nav>
            <img src="./assets/icons/logo.svg" alt="Bestell App Logo">
            <img class="button_menu" src="./assets/icons/menu_button.svg" alt="Menu Button">
        </nav>
    </section>


    <header>
        <img class="hero_img" src="./assets/img/hero.jpg" alt="Image with different kind of Food">
        <img class="burger_logo" src="./assets/icons/burger_logo.svg" alt="Burger image">


        <div class="title">
            <h1><span class="title_design">Burger</span>House</h1>
            <img src="./assets/icons/review.jpg" alt="Website Review">
        </div>

        
        <span>The best of Burgers, Pizza, and Greens, all in one great place.</span>
    </header>


    <section class="quick_navigation" id="navigationToDishCategory">
        <button class="quick_button" data-target="categoryBurger">Burgers</button>
        <button class="quick_button" data-target="categoryPizza">Pizza</button>
        <button class="quick_button" data-target="categorySalad">Salad</button>
    </section>


    <main>
        <section class="delivery_site">
            <div class="menu_section">
                <section class="category_title">
                    <div class="category_title_icon">
                        <img class="category_icon" src="" alt="">
                        <div class="title_section">
                            <h2 id="foodTitle"></h2>
                        </div>
                    </div>
                </section>
                
                <section class="menu_one" id="categoryBurgerMenu">
                    <div class="menu_title_description" id="sectionBurger"></div>
                    <div class="menu_dishes_price" id="burgerVariation"></div>
                </section>


                <div class="category_title">
                    <div class="category_title_icon">
                        <img class="category_icon" src="" alt="">
                        <div class="title_section">
                            <h2></h2>
                        </div>
                    </div>
                </div>
                
                <section class="menu_two" id="categoryPizzaMenu">
                    <div class="menu_title_description" id="sectionPizza"></div>
                    <div class="menu_dishes_price" id="pizzaVariation"></div>
                </section>


                <div class="category_title">
                    <div class="category_title_icon">
                        <img class="category_icon" src="" alt="">
                        <div class="title_section">
                            <h2></h2>
                        </div>
                    </div>
                </div>

                <section class="menu_three" id="categorySaladMenu">
                    <div class="menu_title_description" id="sectionSalad"></div>
                    <div class="menu_dishes_price" id="saladVariation"></div>
                </section>
            </div>

            <aside>
                <section class="basket" id="basketFunction">
                    <h2 class="basket_title"></h2>
                    <div class="body_basket">
                        <span class="empty_basket_description"></span>
                        <img class="empty_basket_icon" src="" alt="">
                        <div class="basket_delivery">
                            <section class="basket_dish">
                                <div class="basket_dish_title"></div>
                                <div class="basket_dish_number"></div>
                            </section>
                        </div>
                        <section class="basket_price_overview">
                            <div class="dish_price"></div>
                            <div class="amount_delivery"></div>
                            <div class="total_price"></div>
                        </section>
                    </div>
                </section>
            </aside>
        </section>

    
    </main>
    

    <script src="./scripts/db.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="script.js"></script>

    
</body>
</html>
