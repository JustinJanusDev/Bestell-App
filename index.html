<!DOCTYPE html>
<html lang="en">


<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="shortcut icon" href="./assets/icons/burger_logo.svg" type="image/x-icon">


    <link rel="stylesheet" href="./styles/variable.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/basket.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="style.css">


    <script src="scripts/db.js"></script>
    <script src="scripts/template.js"></script>
    <script src="scripts/script.js"></script>


</head>


<body onload="init()">


    <section class="head_area">
        <nav>
            <img src="./assets/icons/logo_alternative.svg" alt="Bestell App Logo">
            <img class="button_menu" src="./assets/icons/menu_button.svg" alt="Menu Button">
        </nav>
    </section>


    <header>
        <img class="hero_img" src="./assets/img/hero.jpg" alt="Image with different kind of Food">
        <img class="burger_logo" src="./assets/icons/burger_logo.svg" alt="Burger image">


        <div class="title">
            <h1><span class="title_design">Burger</span>House</h1>
            <img src="./assets/icons/review.jpg" alt="Website Review">
        </div>

        
        <span>The best of Burgers, Pizza, and Greens, all in one great place.</span>
    </header>


    <section class="quick_navigation" id="navigationToDishCategory">
        <a href="#burger" class="quick_button" id="burger_button" type="button" data-target="categoryBurger">Burgers</a>
        <a href="#pizza" class="quick_button" type="button" data-target="categoryPizza">Pizza</a>
        <a href="#salad" class="quick_button" type="button" data-target="categorySalad">Salad</a>
    </section>


    <main>
        
        
        <section class="menu_section">

                <div class="menu_content">
                    <section class="category_section" id="burger">
                        <div class="category_header">
                            <img src="./assets/icons/burger_icon.svg" alt="">
                            <h2>Burger</h2>
                        </div>
                    </section>
                
                    <section class="menu_dishes" id="categoryBurgerMenu">
                        <div id="sectionBurger"></div>
                    </section>
                
                
                    <section class="category_section" id="pizza">
                        <div class="category_header">
                            <img src="./assets/icons/pizza_icon.svg" alt="">
                            <h2>Pizza</h2>
                        </div>
                    </section>
                
                    <section class="menu_dishes" id="categoryPizzaMenu">
                        <div id="sectionPizza"></div>
                    </section>
                
                
                    <section class="category_section" id="salad">
                        <div class="category_header">
                            <img src="./assets/icons/salad_icon.svg" alt="">
                            <h2>Salad</h2>
                        </div>
                    </section>
                
                    <section class="menu_dishes" id="categorySaladMenu">
                        <div id="sectionSalad"></div>
                    </section>
                </div>

                <section class="basket_section">
                    <div class="basket_mobile_section">
                        <a href="#" aria-label="Home">
                            <img src="./assets/icons/home_icon.svg" alt="home button">
                        </a>
                        <a href="#" aria-label="Profile">
                            <img src="./assets/icons/profile_icon.svg" alt="profile icon">
                        </a>
                        <a href="#" aria-label="Takeout">
                            <img src="./assets/icons/takeout_dining.svg" alt="shopping bag icon">
                        </a>
                        <button class="basket_toggle" type="button" onclick="toggleBasket()" aria-label="open shopping cart" aria-expanded="false">
                            <img src="./assets/icons/shopping_cart.svg" alt="basket icon">
                            <span class="basket_badge" id="basketBadge" hidden></span>
                        </button>
                    </div>
                    <div class="basket_area" id="basketArea">
                        <button class="basket_resize_handle" id="basketResizeHandle" type="button" aria-label="Change basket height"></button>
                        <div class="basket_mobile_header">
                            <h2>Your Basket</h2>
                            <button type="button" onclick="toggleBasket()" aria-label="close shopping cart">&times;</button>
                        </div>
                        <h2 class="basket_header">Your Basket</h2>
                        <div class="basket_information" id="basketItems"></div>
                        <div class="basket_total" id="basketTotal"></div>
                    </div>
                </section>
        </section>


        <dialog id="submitOrder" onclick="openCloseDialog()">
            <article onclick="stopPropagation(event)">
                <img src="./assets//icons/food_truck_icon.svg" alt="Foodtruck icon">

                <h2>Thanks for your Order</h2>
                
                <p>Your Product is on its way</p>
                <button class="close_button_dialog" id="closeOrderDialog" type="button" onclick="openCloseDialog()">close</button>
            </article>
        </dialog>

    
    </main>


    <footer>


        <div class="footer_links">
        <a href="">
            <img src="./assets/icons/copyright_symbol.svg" alt="copyright icon">
            <span>2025 BurgerHouse</span>
        </a>
        <a href="impressum.html">Imprint</a>
        <a href="">Cookie Preferences</a>
        </div>


    </footer>
    
    
</body>
</html>
